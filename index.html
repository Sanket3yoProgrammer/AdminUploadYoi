<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://i.postimg.cc/nL6LVhhP/Picsart-24-08-30-07-06-25-055.jpg" type="image/x-icon">
    <meta name="description" content="UploadYoi - Effortlessly upload and manage files online with a sleek, dark-themed interface and real-time Firebase integration.">
    <title>Upload Files</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #53d4ad;
            --secondary: #3dffc5;
            --background: #1a1a1a;
            --surface: #2c2c2c;
            --text: #ffffff;
            --error: #ff5757;
            --success: #4caf50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        .upload-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .upload-container:hover {
            transform: translateY(-5px);
        }

        .upload-section {
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .file-input, .file-name, textarea {
            width: 100%;
            padding: 1rem 1.5rem;
            margin: 0.5rem 0;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(83, 212, 173, 0.1);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .file-input:focus, .file-name:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(83, 212, 173, 0.2);
            transform: translateY(-2px);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .upload-btn, #openImagePicker {
            position: relative;
            padding: 0.8rem 1.8rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 1;
            margin: 1rem 0;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .upload-btn:before, #openImagePicker:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
            z-index: -1;
        }

        .upload-btn:hover:before, #openImagePicker:hover:before {
            left: 100%;
        }

        .upload-btn:hover, #openImagePicker:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(83, 212, 173, 0.3);
        }

        .upload-btn:active, #openImagePicker:active {
            transform: translateY(0);
        }

        .file-input-wrapper {
            position: relative;
            width: 100%;
            height: 120px;
            border: 2px dashed var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1rem 0;
            transition: all 0.3s ease;
            background: rgba(83, 212, 173, 0.05);
        }

        .file-input-wrapper:hover {
            background: rgba(83, 212, 173, 0.1);
            transform: translateY(-2px);
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-input-wrapper .upload-icon {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .file-input-wrapper .upload-text {
            text-align: center;
            color: var(--text);
        }

        .input-group {
            position: relative;
            margin: 1rem 0;
        }

        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
        }

        .input-group input {
            padding-left: 3rem;
        }

        .upload-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface);
            padding: 2rem;
            border-radius: 20px;
            z-index: 1000;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .progress-circle {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }

        .progress-circle svg {
            transform: rotate(-90deg);
        }

        .progress-circle circle {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .toast {
            padding: 1rem 1.5rem;
            margin-bottom: 0.5rem;
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .upload-notification {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            width: 300px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border-left: 4px solid var(--primary);
        }

        .notification-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .notification-header i {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .filename {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text);
            opacity: 0.5;
            cursor: pointer;
            padding: 4px;
            transition: opacity 0.3s;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .progress-wrapper {
            margin: 10px 0;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 5px;
            width: 100%;
        }

        .progress {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            height: 100%;
            width: 0;
            border-radius: 10px;
            position: relative;
        }

        .progress-text {
            font-size: 1rem;
            color: #fff;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: -25%;
        }

        .status {
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status i {
            font-size: 1rem;
        }

        .cool-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: overlayFadeIn 0.3s ease forwards;
        }

        .upload-content {
            text-align: center;
            transform: translateY(20px);
            animation: contentSlideUp 0.5s ease forwards;
        }

        .upload-circle {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .circular-progress {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .progress-background {
            fill: none;
            stroke: rgba(83, 212, 173, 0.1);
            stroke-width: 8;
        }

        .progress-bar {
            fill: none;
            stroke: var(--primary);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 251.2;
            transition: stroke-dashoffset 0.3s ease;
        }

        .upload-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: var(--primary);
            animation: iconPulse 2s ease-in-out infinite;
        }

        .upload-text h3 {
            color: var(--text);
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .upload-status {
            color: var(--primary);
            opacity: 0.8;
            font-size: 1rem;
        }

        @keyframes overlayFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes contentSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes progressAnimation {
            0% {
                stroke-dashoffset: 251.2;
            }
            50% {
                stroke-dashoffset: 125.6;
            }
            100% {
                stroke-dashoffset: 251.2;
            }
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.8;
            }
        }

        .upload-section h2 {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--primary);
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }

        .upload-section h2::before {
            content: '';
            position: absolute;
            left: -100%;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .upload-section h2:hover::before {
            left: 100%;
        }

        .upload-section h2 i {
            margin-right: 0.5rem;
            font-size: 1.5rem;
            color: var(--primary);
            text-shadow: none;
            -webkit-background-clip: unset;
            -webkit-text-fill-color: var(--primary);
            animation: iconBounce 1s infinite alternate;
        }

        @keyframes iconBounce {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-5px);
            }
        }

        .file-selected {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--primary);
            text-align: center;
            transition: opacity 0.3s ease;
            opacity: 0.8;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: overlayFadeIn 0.3s ease forwards;
        }

        .overlay-content {
            text-align: center;
            animation: contentSlideUp 0.5s ease forwards;
        }

        .loader {
            font-size: 3rem;
            color: var(--primary);
            animation: float 6s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        .success-icon {
            font-size: 5rem;
            color: var(--success);
            display: none;
            animation: pop 0.5s ease forwards;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .pulse-icon {
            animation: pulse 3.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <h1 style="color: #53d4ad; display: flex; justify-content: center;">  Upload Files</h1>
        <p style="text-align: center;">"Only administrators with exclusive access to this website's links can upload items to the Upload-Yoi gallery."</p>
        <div class="upload-section">
            <h2><i class="fas fa-file-upload icon"></i>Upload File</h2>
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" class="file-input" />
                <div class="upload-icon"><i class="fas fa-upload"></i></div>
                <div class="upload-text">Drag & Drop or Click to Upload</div>
                
            </div>
            <div id="fileSelected" class="file-selected"></div>
            <input type="text" id="fileNameInput" class="file-name" placeholder="Enter file name" />
            <button onclick="uploadFile('file')" class="upload-btn"><i class="fas fa-upload icon"></i>Upload File</button>
            <div class="progress-bar">
                <div id="fileProgress" class="progress"></div>
            </div>
            <span id="fileMessage" class="message"></span>
        </div>

        <div class="upload-section">
            <h2><i class="fas fa-image icon"></i>Upload Image</h2>
            <button id="openImagePicker" class="upload-btn"><i class="fas fa-folder-open icon"></i>Select Image</button>
            <input type="file" id="imageInput" class="file-input" accept="image/*" style="display: none;" />
            <div id="imageSelected" class="file-selected"></div>
            <input type="text" id="imageNameInput" class="file-name" placeholder="Enter image name" />
            <button onclick="uploadFile('image')" class="upload-btn"><i class="fas fa-upload icon"></i>Upload Image</button>
            <div class="progress-bar">
                <div id="imageProgress" class="progress"></div>
            </div>
            <span id="imageMessage" class="message"></span>
            
        </div>

        <div class="upload-section">
            <h2><i class="fas fa-align-left icon"></i>Upload Text</h2>
            <textarea id="textInput" class="file-input" placeholder="Enter text"></textarea>
            <input type="text" id="textNameInput" class="file-name" placeholder="Enter text name" />
            <button onclick="uploadText()" class="upload-btn"><i class="fas fa-upload icon"></i>Upload Text</button>
            <div class="progress-bar">
                <div id="textProgress" class="progress"></div>
            </div>
            <span id="textMessage" class="message"></span>
        </div>

        <div class="upload-section">
            <h2><i class="fab fa-youtube icon"></i>Upload YouTube Link</h2>
            <input type="text" id="youtubeInput" class="file-input" placeholder="Enter YouTube URL" />
            <input type="text" id="youtubeNameInput" class="file-name" placeholder="Enter video name" />
            <button onclick="uploadYouTube()" class="upload-btn"><i class="fas fa-upload icon"></i>Upload YouTube Link</button>
            <div class="progress-bar">
                <div id="youtubeProgress" class="progress"></div>
            </div>
            <span id="youtubeMessage" class="message"></span>
        </div>

        <div class="upload-section">
            <h2><i class="fas fa-link icon"></i>Upload Link</h2>
            <input type="text" id="linkInput" class="file-input" placeholder="Enter URL" />
            <input type="text" id="linkNameInput" class="file-name" placeholder="Enter link name" />
            <button onclick="uploadLink()" class="upload-btn"><i class="fas fa-upload icon"></i>Upload Link</button>
            <div class="progress-bar">
                <div id="linkProgress" class="progress"></div>
            </div>
            <span id="linkMessage" class="message"></span>
        </div>
    </div>

    <div id="overlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <div class="loader"><i class="fas fa-cloud-upload-alt pulse-icon"></i></div>
            <h3 id="overlayMessage">Uploading...</h3>
            <div class="progress-bar" style="margin-top: 10px;">
                <div id="overlayProgress" class="progress"></div>
            </div>
            <div class="success-icon"><i class="fas fa-check-circle"></i></div>
        </div>
    </div>

    <footer>
        <h5 style="display: flex; justify-content: center; font-weight: bold;">
            Made with fun by- <a style="color: #3dffc5; font-weight: underline;" href="https://github.com/sanket3yoprogrammer">@Sanket3yoprogrammer</a>

    <script>
        document.getElementById('openImagePicker').addEventListener('click', function() {
            document.getElementById('imageInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            const fileSelected = document.getElementById('fileSelected');
            if (file) {
                fileSelected.textContent = `Selected file: ${file.name}`;
            } else {
                fileSelected.textContent = '';
            }
        });

        document.getElementById('imageInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            const imageSelected = document.getElementById('imageSelected');
            if (file) {
                imageSelected.textContent = `Selected image: ${file.name}`;
            } else {
                imageSelected.textContent = '';
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyCIsuaOPUEWCf1IyM5Uh88TCRlIoj3nSC4",
            authDomain: "uploadyoio.firebaseapp.com",
            databaseURL: "https://uploadyoio-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "uploadyoio",
            storageBucket: "uploadyoio.appspot.com",
            messagingSenderId: "476111061097",
            appId: "1:476111061097:web:0ce058a0b5780d5304a2f8",
            measurementId: "G-JK4RZYGVV9"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const storage = firebase.storage();
        const database = firebase.database();

        function getSizeInReadableFormat(sizeInBytes) {
            if (sizeInBytes < 1024 * 1024) {
                return (sizeInBytes / 1024).toFixed(0) + ' KB';
            } else {
                return (sizeInBytes / (1024 * 1024)).toFixed(2) + ' MB';
            }
        }

        function getFileExtension(filename) {
            return filename.split('.').pop().toLowerCase();
        }

        function showOverlay(message) {
            const overlay = document.getElementById('overlay');
            const overlayMessage = document.getElementById('overlayMessage');
            overlayMessage.textContent = message;
            overlay.style.display = 'flex';
        }

        function hideOverlay() {
            const overlay = document.getElementById('overlay');
            overlay.style.display = 'none';
        }

        function uploadFile(type) {
            const fileInput = document.getElementById(type + 'Input');
            const fileNameInput = document.getElementById(type + 'NameInput');
            const message = document.getElementById(type + 'Message');

            const file = fileInput.files[0];
            const fileName = fileNameInput.value || file.name;

            if (!file) {
                message.textContent = 'Please select a file';
                return;
            }

            showOverlay('Uploading...');

            const storageRef = storage.ref().child(type + '/' + fileName);
            const uploadTask = storageRef.put(file);

            uploadTask.on('state_changed',
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    document.getElementById('overlayProgress').style.width = Math.round(progress) + '%';
                },
                (error) => {
                    hideOverlay();
                    message.textContent = 'Upload failed: ' + error.message;
                    alert('Upload failed: ' + error.message);
                },
                () => {
                    uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                        const fileData = {
                            name: fileName,
                            type: type,
                            extension: getFileExtension(file.name),
                            size: getSizeInReadableFormat(file.size),
                            url: downloadURL,
                            date: new Date().toLocaleString() // Current date and time
                        };

                        database.ref(type).push(fileData).then(() => {
                            document.getElementById('overlayMessage').textContent = 'Upload successful!';
                            document.getElementById('overlayProgress').style.width = '100%';
                            document.querySelector('.success-icon').style.display = 'block';
                            setTimeout(() => {
                                hideOverlay();
                                document.querySelector('.success-icon').style.display = 'none';
                            }, 2000);
                            fileInput.value = '';  // Clear file input
                            fileNameInput.value = '';  // Clear file name input
                        });
                    });
                }
            );
        }

        function uploadText() {
            const textInput = document.getElementById('textInput');
            const textNameInput = document.getElementById('textNameInput');
            const message = document.getElementById('textMessage');

            const text = textInput.value;
            const textName = textNameInput.value || 'Text';

            if (!text) {
                message.textContent = 'Please enter text';
                return;
            }

            showOverlay('Uploading...');

            const fileData = {
                name: textName,
                type: 'text',
                content: text,
                date: new Date().toLocaleString() // Current date and time
            };

            database.ref('text').push(fileData).then(() => {
                message.textContent = 'Upload successful!';
                alert('Upload successful!');
                textInput.value = '';  // Clear text input
                textNameInput.value = '';  // Clear text name input
                hideOverlay(); // Hide overlay after successful upload
            }).catch((error) => {
                hideOverlay();
                message.textContent = 'Failed to save data: ' + error.message;
                alert('Failed to save data: ' + error.message);
            });
        }

        function uploadYouTube() {
            const youtubeInput = document.getElementById('youtubeInput');
            const youtubeNameInput = document.getElementById('youtubeNameInput');
            const message = document.getElementById('youtubeMessage');

            const youtubeUrl = youtubeInput.value;
            const youtubeName = youtubeNameInput.value || 'YouTube Video';

            if (!youtubeUrl) {
                message.textContent = 'Please enter a YouTube URL';
                return;
            }

            showOverlay('Uploading...');

            const fileData = {
                name: youtubeName,
                type: 'youtube',
                url: youtubeUrl,
                date: new Date().toLocaleString() // Current date and time
            };

            database.ref('youtube').push(fileData).then(() => {
                message.textContent = 'Upload successful!';
                alert('Upload successful!');
                youtubeInput.value = '';  // Clear YouTube URL input
                youtubeNameInput.value = '';  // Clear YouTube name Input
                hideOverlay(); // Hide overlay after successful upload
            }).catch((error) => {
                hideOverlay();
                message.textContent = 'Failed to save data: ' + error.message;
                alert('Failed to save data: ' + error.message);
            });
        }

        function uploadLink() {
            const linkInput = document.getElementById('linkInput');
            const linkNameInput = document.getElementById('linkNameInput');
            const message = document.getElementById('linkMessage');

            const linkUrl = linkInput.value;
            const linkName = linkNameInput.value || 'Link';

            if (!linkUrl) {
                message.textContent = 'Please enter a URL';
                return;
            }

            showOverlay('Uploading...');

            const fileData = {
                name: linkName,
                type: 'link',
                url: linkUrl,
                date: new Date().toLocaleString() // Current date and time
            };

            database.ref('link').push(fileData).then(() => {
                message.textContent = 'Upload successful!';
                alert('Upload successful!');
                linkInput.value = '';  // Clear URL input
                linkNameInput.value = '';  // Clear link name input
                hideOverlay(); // Hide overlay after successful upload
            }).catch((error) => {
                hideOverlay();
                message.textContent = 'Failed to save data: ' + error.message;
                alert('Failed to save data: ' + error.message);
            });
        }
